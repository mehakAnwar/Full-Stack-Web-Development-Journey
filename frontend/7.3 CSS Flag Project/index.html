<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */
    .flag{
      height: 600px;
      width: 900px;
      background-color: #ce1126;
      position: relative;
    }
    .flag > div{
      background-color: #002868;
      width:100%;
      height: 300px;
      position: absolute;
      top:150px;
    }
     .flag>div> div{
      height: 200px;
      width: 200px;
      border-radius: 50%;
      background-color: #f1f1f1;
      position: relative;
      top: 50px;
      left: 350px;
    }
    p{
      margin: 0;
      padding: 0;
      text-align: center;
      font-size: 5rem;
    }
    .flag>p{
      color: #f1f1f1;
    }
  </style>
</head>

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
